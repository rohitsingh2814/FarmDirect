{% extends "base.html" %}
{% block title %}Password updated | FarmDirect{% endblock %}
{% block content %}
<div class="row justify-content-center fd-fade-up">
  <div class="col-md-7 col-lg-5">
    <div class="fd-panel p-4 p-md-5 text-center">
      <div class="fs-1 mb-2">✅</div>
      <span class="fd-eyebrow mb-2">All Set</span>
      <h1 class="h3 fw-bold mb-2">Password <span class="text-gradient-emerald">updated</span></h1>
      <p class="text-muted small mb-4">Your password has been changed. You can now sign in with your new password.</p>
      <a href="{% url 'login' %}" class="btn fd-btn-primary px-4">Login Now</a>
    </div>
  </div>
</div>
{% endblock %}
