{% extends "base.html" %}
{% block title %}Login | FarmDirect{% endblock %}
{% block content %}
<div class="row justify-content-center fd-fade-up">
  <div class="col-md-6 col-lg-5">
    <div class="fd-panel p-4 p-md-5">
      <span class="fd-eyebrow mb-2">Member Access</span>
      <h1 class="h3 fw-bold mb-1">Welcome <span class="text-gradient-emerald">back</span></h1>
      <p class="text-muted small mb-4">Sign in to manage your farm produce or track fresh orders.</p>
      <form method="post">
        {% csrf_token %}
        <div class="mb-3">
          <label class="form-label fw-semibold small">Username</label>
          <input class="form-control" name="username" required>
        </div>
        <div class="mb-4">
          <div class="d-flex justify-content-between align-items-center mb-1">
            <label class="form-label fw-semibold small mb-0">Password</label>
            <a href="{% url 'password_reset' %}" class="small fw-semibold text-success text-decoration-none">Forgot password?</a>
          </div>
          <input class="form-control" type="password" name="password" required>
        </div>
        <button class="btn fd-btn-primary w-100 py-2">Login</button>
      </form>
      <p class="mt-4 mb-0 text-center small text-muted">
        New here? <a href="{% url 'signup' %}" class="fw-bold text-success text-decoration-none">Create an account</a>
      </p>
    </div>
  </div>
</div>
{% endblock %}
