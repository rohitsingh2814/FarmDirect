{% extends "base.html" %}{% block title %}Login | FarmDirect{% endblock %}
{% block content %}<div class="row justify-content-center"><div class="col-md-6 col-lg-5"><div class="card shadow-sm"><div class="card-body p-4"><h1 class="h3 mb-3">Welcome back</h1><form method="post">{% csrf_token %}<div class="mb-3"><label class="form-label">Username</label><input class="form-control" name="username" required></div><div class="mb-3"><label class="form-label">Password</label><input class="form-control" type="password" name="password" required></div><button class="btn btn-success w-100">Login</button></form><p class="mt-3 mb-0 text-center">New here? <a href="{% url 'signup' %}">Create an account</a></p></div></div></div></div>{% endblock %}
