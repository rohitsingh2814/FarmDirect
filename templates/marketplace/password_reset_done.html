{% extends "base.html" %}
{% block title %}Reset link sent | FarmDirect{% endblock %}
{% block content %}
<div class="row justify-content-center fd-fade-up">
  <div class="col-md-6 col-lg-5">
    <div class="fd-panel p-4 text-center">
      <div class="fs-2 mb-2">✉️</div>
      <h1 class="h4 fw-bold mb-2">Check Your Email</h1>
      <p class="text-muted small mb-3">
        We have emailed you a link to reset your password. If it doesn't appear within a few minutes, check your spam folder.
      </p>
      <a href="{% url 'login' %}" class="btn fd-btn-primary px-4 btn-sm">Back to Login</a>
    </div>
  </div>
</div>
{% endblock %}
