services:
  - type: web
    name: farmdirect
    runtime: python
    buildCommand: "./build.sh"
    startCommand: "gunicorn farmdirect.wsgi:application"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: DATABASE_URL
        fromDatabase:
          name: farmdirect-db
          property: connectionString

databases:
  - name: farmdirect-db
    plan: free
